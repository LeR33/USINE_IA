{% extends "base.html" %}
{% block title %}Clients{% endblock %}
{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center;">
    <h1>Annuaire Clients</h1>
    <a href="/clients/create" class="button">Nouveau Client</a>
</div>

<table>
    <thead>
        <tr>
            <th>Nom</th>
            <th>Téléphone</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for client in clients %}
        <tr>
            <td>{{ client.nom }}</td>
            <td>{{ client.telephone or '-' }}</td>
            <td>{{ client.email or '-' }}</td>
            <td><a href="/clients/{{ client.id }}">Voir Détails</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
