<!doctype html>
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · {{ p.nom_societe }}</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light');</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>:root{--brand:{{ p.couleur_principale or '#0d6efd' }}} body{background:var(--bs-tertiary-bg);min-height:100vh;display:grid;place-items:center}
  .card{border:0;box-shadow:0 2px 8px rgba(0,0,0,.1);border-radius:.75rem;width:min(420px,92vw)} .btn-brand{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn-brand:hover{filter:brightness(.9);color:#fff}.text-brand{color:var(--brand)}</style>
</head>
<body>
<div class="card"><div class="card-body p-4">
  <div class="text-center mb-3">
    {% if p.logo %}<img src="/static/uploads/{{ p.logo }}" alt="Logo" style="max-height:48px">{% else %}<i class="bi bi-snow2 fs-1 text-brand"></i>{% endif %}
    <h1 class="h4 mt-2">{{ p.nom_societe }}</h1>
  </div>
  {% if errors %}<div class="alert alert-danger" role="alert"><ul class="mb-0">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul></div>{% endif %}
  {% block body %}{% endblock %}
</div></div>
</body></html>
