{% extends "auth/_layout.html" %}{% block title %}Connexion{% endblock %}
{% block body %}
<form method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="mb-3"><label class="form-label" for="email">E-mail</label>
    <input class="form-control" type="email" id="email" name="email" autocomplete="username" required autofocus value="{{ form.get('email', '') }}"></div>
  <div class="mb-3"><label class="form-label" for="mot_de_passe">Mot de passe</label>
    <input class="form-control" type="password" id="mot_de_passe" name="mot_de_passe" autocomplete="current-password" required></div>
  <button class="btn btn-brand w-100" type="submit">Se connecter</button>
</form>{% endblock %}
